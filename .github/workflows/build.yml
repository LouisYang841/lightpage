name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Optional: supply a private keystore so successive builds keep the same
      # signing identity (and can upgrade each other). Without it, each run
      # generates a throwaway test key.
      - name: Restore keystore (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTPAGE_KEYSTORE_B64 }}
        run: |
          mkdir -p android/signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/signing/lightpage-test.jks

      - name: Build
        env:
          LIGHTPAGE_KEYSTORE_PASS: ${{ secrets.LIGHTPAGE_KEYSTORE_PASS }}
        run: bash android/build.sh

      # Artifacts are downloadable by any GitHub account, so they are only
      # published when the owner explicitly starts the workflow.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: lightpage-0.2.0-test-apk
          path: android/out/lightpage-0.2.0-test.apk
          if-no-files-found: error
